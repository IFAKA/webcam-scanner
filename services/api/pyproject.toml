[project]
name = "room-scanner-api"
version = "0.1.0"
description = "Local API for Room Boundary Scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
